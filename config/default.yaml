# ============================================================
# Laser Printing System - Default Configuration
# ============================================================
# Copy this file and modify for your specific setup.
# Values here match the lab's current hardware configuration.
# ============================================================

laser:
  ip: "192.168.244.10"
  api_base: "/phoebe/v0/Basic"
  # Maximum time to wait for a toggle to settle (seconds).
  settle_timeout_s: 1.0
  # Poll interval while waiting for settle (0 = spin).
  poll_interval_s: 0.01

stage:
  ip: "10.0.0.100"
  port: 701
  # Axis mapping: 0=X, 1=Y, 2=Z.
  axes: [0, 1, 2]
  # Axes that require brushless motor commutation at startup.
  commutation_axes: [0, 1]
  # Default per-axis velocity at connect (mm/s).
  default_velocity: [1.0, 1.0, 1.0]
  # Physical travel range per axis (mm).
  range_mm: [-25.0, 25.0]
  # Default per-axis safety clamp on any move_absolute/relative (mm).
  # Individual calls can override via `clamp_mm=...`.
  max_step_mm: 5.0

synchronization:
  # Strategy for coordinating laser on/off with stage motion:
  #   "sequential"       - laser toggles between moves (simple test only)
  #   "velocity_timed"   - pre-calibrated timing; laser fires during the
  #                        constant-velocity region of each move
  #   "hardware_trigger" - (reserved) SPiiPlus TTL out triggers the laser
  strategy: "velocity_timed"
  # Speed-tolerance band used by MotionProfiling to detect "in coast region"
  velocity_tolerance_fraction: 0.05
  # Laser pre-fire leads (seconds) - measured ~200-270 ms settle on this
  # hardware. The synchronizer sends the ON POST `laser_on_lead_s` before
  # the desired physical-on instant, similarly for OFF.
  laser_on_lead_s: 0.20
  laser_off_lead_s: 0.20
  laser_settle_timeout_s: 1.0
  # Acceleration calibration - one entry per measured velocity.
  # accel_time_s:     time from motion start to reaching target velocity
  # accel_distance_mm: distance traveled during acceleration phase
  # Measure these with scripts or MotionProfiling; the 5 mm/s entry below
  # is the long-standing lab value (from async_motor.py notes).
  calibration:
    - velocity_mm_s: 5.0
      accel_time_s: 0.357
      accel_distance_mm: 0.79

logging:
  level: "INFO"
  # Set to a file path to also log to file (null = console only)
  file: null

labgate:
  # Platform mode: "sim" runs entirely without hardware (dev/CI/agent
  # integration testing); "rig" drives the real stage+laser via the
  # laser_printing controllers (requires the setup computer).
  mode: "sim"
  # Where plans, runs, artifacts and the audit log are stored.
  storage_dir: "labgate_data"
  # YAML file mapping bearer tokens -> identities/roles.
  # See config/tokens.example.yaml; never commit real tokens.
  tokens_file: "config/tokens.yaml"
