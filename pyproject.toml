[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "laser-printing"
version = "0.1.0"
description = "Control software for 2PP laser printing and ablation system"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "trimesh>=4.5",
    "requests>=2.32",
    "matplotlib>=3.9",
    "opencv-python>=4.10",
    "tqdm>=4.67",
    "pandas>=2.2",
    "pyDOE2",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
